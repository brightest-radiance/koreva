<style>
:root{--bg:#f2f3f7;--card:rgba(255,255,255,.82);--cs:#fff;--tx:#14151a;--mu:#62646e;--ac:#d94a12;--c2:#0a84c6;--g:#14804a;--o:#b25f00;--red:#d1203a;--v:#6d4fd6;--line:rgba(0,0,0,.1);--soft:rgba(0,0,0,.07);--on:#fff;--glass:rgba(255,255,255,.72);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05060b;--card:rgba(30,32,44,.62);--cs:#262938;--tx:#f5f5f7;--mu:#a2a4b2;--ac:#ff7a3d;--c2:#5ad1ff;--g:#34e3a0;--o:#ffb020;--red:#ff5468;--v:#a78bfa;--line:rgba(255,255,255,.13);--soft:rgba(255,255,255,.1);--glass:rgba(14,16,24,.68);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05060b;--card:rgba(30,32,44,.62);--cs:#262938;--tx:#f5f5f7;--mu:#a2a4b2;--ac:#ff7a3d;--c2:#5ad1ff;--g:#34e3a0;--o:#ffb020;--red:#ff5468;--v:#a78bfa;--line:rgba(255,255,255,.13);--soft:rgba(255,255,255,.1);--glass:rgba(14,16,24,.68);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;padding:18px 16px 118px;max-width:560px;margin:0 auto;overflow-x:hidden}
.orb{position:fixed;width:min(80vmax,520px);height:min(80vmax,520px);border-radius:50%;filter:blur(80px);opacity:.3;z-index:-1;pointer-events:none;transform:translate3d(0,calc(var(--sy,0)*-.15px),0)}
.orb.a{top:-14%;left:-34%;background:var(--ac)}.orb.b{bottom:-18%;right:-34%;background:var(--c2)}
@media (prefers-reduced-motion:no-preference){.orb{animation:fl 16s ease-in-out infinite alternate}.orb.b{animation-direction:alternate-reverse}}
@keyframes fl{to{margin:40px 0 0 30px}}
h1{font-size:clamp(2.3rem,11vw,3.1rem);line-height:1.02;letter-spacing:-.04em;font-weight:760;margin:6px 4px 4px;transform-origin:left top;transform:scale(calc(1 - min(var(--sy,0),140)*.0007))}
h2{font-size:1.3rem;letter-spacing:-.02em;font-weight:680;margin:26px 4px 10px}
h3{font-size:1.06rem;font-weight:620;margin:0 0 4px;letter-spacing:-.01em}
h4{font-size:.95rem;margin:16px 0 8px}
.sub,.mu{color:var(--mu);font-size:.92rem}.sub{margin:0 4px 16px}
.card{background:var(--card);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border:1px solid var(--line);border-top-color:rgba(255,255,255,.28);border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:0 14px 34px -16px rgba(0,0,0,.45)}
.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .12s ease-out,background .2s,opacity .2s}
button:active{transform:scale(.96)}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:14px;padding:14px 16px;font-weight:650;width:100%;box-shadow:0 8px 22px -10px var(--ac)}
.btn.t{background:var(--soft);color:var(--ac);box-shadow:none}.btn.d{background:var(--soft);color:var(--red);box-shadow:none;margin-top:8px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:9px 2px;border-radius:9px;font-weight:620;font-size:.88rem;color:var(--mu)}
.seg .on{background:var(--cs);color:var(--tx);box-shadow:0 2px 6px rgba(0,0,0,.22)}
input{font:inherit;padding:12px;border-radius:13px;border:1px solid var(--line);background:var(--soft);color:var(--tx);width:100%;min-width:0}
.tmi{font-size:2.4rem;font-weight:700;text-align:center;letter-spacing:-.03em}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tk{display:flex;align-items:center;border-top:1px solid var(--line)}.tk:first-child{border-top:0}
.tg{flex:1;display:flex;gap:12px;align-items:flex-start;background:none;border:0;padding:12px 0;text-align:left;min-width:0}
.cb{width:27px;height:27px;border-radius:50%;border:2px solid var(--mu);flex:none;display:grid;place-items:center;color:transparent;font-weight:700;font-size:.85rem;transition:background .25s,border-color .25s}
.dn .cb{background:var(--g);border-color:var(--g);color:#fff}.dn .ti{color:var(--mu);text-decoration:line-through}
.pop .cb{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.tm{color:var(--ac);font-weight:620;font-size:.85rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ed{background:none;border:0;color:var(--ac);font-weight:620;padding:12px 2px 12px 10px}
.rg{display:flex;align-items:center;gap:16px}.rg svg{width:140px;height:140px;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.rg circle{fill:none;stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:60px 60px}
.tr{opacity:.18}.v{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.9,.25,1)}
.big{font-size:1.45rem;font-weight:720;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;width:0;border-radius:4px;transition:width .9s cubic-bezier(.2,.9,.25,1),background .3s}
.fr{width:100%;display:flex;gap:12px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;text-align:left}.fr:first-child{border-top:0}
details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:620}
ul{margin:6px 0 0;padding-left:18px}li{margin:6px 0}
.view{animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(var(--dx,0px)) translateY(10px);filter:blur(8px)}}
.tilt{position:relative;overflow:hidden;transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .6s cubic-bezier(.2,.9,.25,1)}
.tilt.hot{transition:none}
.tilt::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.25),transparent 55%);opacity:var(--go,0);transition:opacity .3s}
.sw{width:51px;height:31px;border-radius:16px;background:var(--soft);position:relative;border:0;flex:none;margin-left:8px}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.sw.on{background:var(--g)}.sw.on::after{transform:translateX(20px)}
.off{opacity:.45}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips button{flex:none;border:1px solid var(--line);background:var(--soft);border-radius:20px;padding:8px 14px;font-weight:600;font-size:.88rem}
.chips .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.fl{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:.92rem}.fl b{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.q{display:flex;gap:8px}.q button{width:48px;border:0;border-radius:13px;background:var(--soft);font-size:1.4rem;font-weight:600}.q input{text-align:center;font-size:1.2rem;font-weight:650}
.sh{font-size:1.35rem;margin-bottom:10px}
nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;background:var(--glass);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);border:1px solid var(--line);border-radius:28px;display:flex;padding:5px;z-index:10;box-shadow:0 12px 34px -8px rgba(0,0,0,.5)}
nav::before{content:"";position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/5);border-radius:23px;background:var(--soft);transform:translateX(calc(var(--i,0)*100%));transition:transform .55s cubic-bezier(.3,1.35,.5,1)}
nav button{flex:1;position:relative;border:0;background:none;color:var(--mu);font-size:.68rem;font-weight:620;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0}
nav button.on{color:var(--ac)}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sc{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20}
#sh{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--cs);border-radius:28px 28px 0 0;z-index:21;transform:translateY(110%);visibility:hidden;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -14px 50px rgba(0,0,0,.4)}

 h+=`<div class="card"><h3>Daily nutrition overview</h3><div class="mu" style="margin-bottom:10px">Approximate references, not medical prescriptions. Values depend on portion size, recipe and labels.</div>${NU.map(n=>{const p=t[n[0]]/n[3]*100;return `<div class="row"><span class="grow"><b>${n[1]}</b></span><span class="mu">${R(t[n[0]])} of ${n[3]} ${n[2]}</span></div><div class="bar"><i data-w="${Math.min(100,p)}%" style="background:${colr(n[4],p)}"></i></div>`}).join('')}<div class="row" style="margin-top:10px"><span class="grow"><b>Total sugar (all sources)</b></span><span>${fmt(R(t.su*10)/10)} g</span></div><p class="mu">Total sugar includes natural and added sugar, so it is not shown as a strict daily target.</p><details><summary>Known/estimated sodium: ${R(t.na)} mg</summary><p class="mu">This adds the estimates attached to foods you logged and any measured salt you logged. It can be incomplete: shared-pot, restaurant and packaged-food sodium may be unknown or different from this database. ${t.naUnknown?`${t.naUnknown} custom item(s) have no sodium label entered and are excluded from this estimate.`:''} There is no sodium pass/fail meter here.</p></details></div>`;
 if(I.length)h+=`<div class="card"><h3>What it means</h3>${I.map(x=>`<div class="fl"><b style="background:var(--${x[0]==='g'?'g':x[0]==='w'?'o':'red'})"></b><span>${x[1]}</span></div>`).join('')}</div>`;
 h+=`<h2>Logged today</h2><div class="card">${lg.length?ML.map(m=>lg.map((x,i)=>({x,i})).filter(o=>(o.x.m||'Snack')===m).map(o=>`<div class="tk"><div class="grow" style="padding:10px 0"><span class="ti">${esc(o.x.n)}</span><br><span class="mu">${m}: ${esc(o.x.s)}, ${R(o.x.k)} kcal, ${fmt(R(o.x.p*10)/10)} g protein</span></div><button class="ed" data-a="fr" data-k="${o.i}">Remove</button></div>`).join('')).join(''):'<p class="mu" style="margin:0 0 8px">Nothing yet. Search a food below.</p>'}<button class="btn t" style="margin-top:8px" data-a="fc">Add your own food</button><button class="btn" style="margin-top:8px" data-a="recipe">Build a homemade recipe</button></div>`;
 if(S.recipes.length)h+=`<h2>Saved recipes</h2><div class="card">${S.recipes.map((r,i)=>`<button class="fr" data-a="ropen" data-k="${i}"><span class="grow"><b>${esc(r.n||'Homemade recipe')}</b><br><span class="mu">${(r.ingredients||[]).length} ingredients · ${r.servings||1} servings per recipe</span></span><span class="tm">Open</span></button>`).join('')}</div>`;
 h+=`<h2>Food guide</h2><div class="card"><div class="chips" style="margin-bottom:8px">${FCATS.map(c=>`<button class="${FCAT===c?'on':''}" data-a="fcat" data-k="${esc(c)}">${esc(c)}</button>`).join('')}</div><input id="fq" type="search" placeholder="Search: dhido, chicken, mustard oil…" autocomplete="off" aria-label="Search foods"><div id="fl">${foodList('')}</div></div>`;
 return h+'<div class="card"><h3>Tips</h3><ul style="margin:0"><li>Spread protein across meals; the right portion depends on your body size, activity and overall diet.</li><li>Meal frequency is a preference—consistency and total intake matter more than eating every 3–4 hours.</li><li>For homemade food, use the recipe builder to include rice/flour, dal, vegetables, oil/ghee, salt and other ingredients, then divide by servings.</li><li>For packaged drinks or sauces, the local label is more accurate than a generic database estimate.</li><li>If your average weight does not rise over 2–3 weeks, a small increase in intake may help; adjust using your multi-week trend and appetite.</li></ul><p class="mu">Database entries are estimates. For the best log, use weighed portions and packaging labels. Oil, salt and recipe variations can materially change a dish.</p></div>';
}
let FCAT='All';
const FCATS=['All','Nepali foods','Meat & eggs','Oils & sauces','Drinks & dairy','Fruit & veg','Other'];
function foodCategory(f){const x=(f.n+' '+(f.aliases||'')+' '+(f.t||'')).toLowerCase();if(/mustard oil|sunflower oil|soybean oil|olive oil|coconut oil|cooking oil|ghee|table salt|namak|ketchup|chilli sauce|soy sauce|mayonnaise|table sugar|added sugar/.test(x))return 'Oils & sauces';if(/chicken|poultry|buffalo|\bbuff\b|goat|mutton|lamb|pork|duck|turkey|rabbit|venison|fish|machha|rohu|salmon|tuna|sardine|prawn|shrimp|crab|squid|calamari|\begg\b|anda|meat|masu/.test(x))return 'Meat & eggs';if(/coca-cola|coke|pepsi|sprite|fanta|mountain dew|sting|lemonade|nimbu pani|lemon water|iced tea|malt drink|bournvita|horlicks|maaza|frooti|red bull|soft drink|cola|lassi|mohi|buttermilk|milk tea|coffee|green tea|soy milk|whole milk|curd|dahi|yogurt|whey protein|paneer|cheese|butter|tofu/.test(x))return 'Drinks & dairy';if(/dal|daal|bhat|rice|roti|paratha|chiura|poha|khichdi|sattu|gundruk|saag|tarkari|dhido|dhindo|kheer|dhakani|sel roti|achar|pickle|chole|rajma|thukpa|chowmin|khasi|nepali|momo|bodi|simi|sajyun|sisnu|tama\b|kinema|masyaura|bhatmas|sekuwa|choila|chatamari|yomari|laphing|chatpate|kwati|gahat|kodo|pidalu|tarul|sakhar|juju|dalmot|lalmohan|jeri|rayo|iskus|kerau|pharsi|mula ko|golbheda|aloo|bhindi|bhanta|chyau|kauli|lauka|makai|anda tarkari/.test(x))return 'Nepali foods';if(/banana|guava|apple|orange|papaya|spinach|palak|carrot|broccoli|potato|tomato|cucumber|onion|brinjal|okra|pumpkin|pea|corn|beetroot|radish|cabbage|cauliflower|pepper|lettuce|mango|watermelon|grape|pomegranate|pineapple|litchi|kiwi|strawberr|blueberr|avocado|fruit|vegetable/.test(x))return 'Fruit & veg';return 'Other'}
function foodList(q,cat=FCAT){q=(q||'').toLowerCase().trim();return FD().map((f,i)=>[f,i]).filter(([f])=>(cat==='All'||foodCategory(f)===cat)&&((f.n+' '+(f.t||'')+' '+(f.aliases||'')).toLowerCase().includes(q))).sort(([a],[b])=>q?Number((b.n+' '+(b.aliases||'')).toLowerCase().includes(q))-Number((a.n+' '+(a.aliases||'')).toLowerCase().includes(q)):0).map(([f,i])=>{const u=f.u[0],m=u[1]/(f.base||100);return `<button class="fr" data-a="fa" data-k="${i}"><span class="grow"><span class="ti">${esc(f.n)}</span><br><span class="mu">${esc((f.t||'Saved custom food').split('.')[0])}.<br>1 ${esc(u[0])}: ${R(f.k*m)} kcal, ${fmt(R(f.p*m*10)/10)} g protein</span></span><span class="tm">${R(f.k*m)} kcal</span></button>`}).join('')||'<p class="mu">No matches. Try another name, a local alias, or add a custom food from its label.</p>'}

function viewMe(){

 let h=`<h1>Me</h1><p class="sub">Where you are and what to do about it</p><div class="card tilt"><div class="big" style="font-size:2.4rem"><span class="cu" data-n="${l.w}">${l.w}</span> kg</div><div class="mu">BMI ${(l.w/Math.pow(P.heightCm/100,2)).toFixed(1)}. Height ${P.heightCm} cm, age ${P.age}. BMI is a screening measure, not a diagnosis. Milestone: ${P.milestone} kg; longer-term target: ${P.target} kg.</div><div class="bar"><i data-w="${Math.max(0,Math.min(100,l.w/P.target*100))}%" style="background:var(--ac)"></i></div>${spark()}<div class="row" style="margin-top:6px"><input id="wkg" type="number" step="0.1" placeholder="Weight (kg)" aria-label="Weight in kilograms" min="25" max="300"><input id="warm" type="number" step="0.1" placeholder="Arm (cm)" aria-label="Optional arm circumference in centimetres" min="10" max="100"></div><button class="btn" style="margin-top:10px" data-a="addwt">Log today’s measurements</button>${S.wt.length?'<ul>'+S.wt.slice(-6).reverse().map(x=>`<li>${x.d}: ${x.w} kg${x.a?', arm '+x.a+' cm':''}</li>`).join('')+'</ul>':''}<details style="margin-top:12px"><summary>Profile & weight goals</summary><div class="row" style="margin-top:10px"><div class="grow"><label class="mu" for="pheight">Height (cm)</label><input id="pheight" type="number" min="100" max="230" step="0.5" value="${P.heightCm}"></div><div class="grow"><label class="mu" for="page">Age (years)</label><input id="page" type="number" min="13" max="110" value="${P.age}"></div></div><div class="row" style="margin-top:8px"><div class="grow"><label class="mu" for="pmile">First milestone (kg)</label><input id="pmile" type="number" min="30" max="250" step="0.1" value="${P.milestone}"></div><div class="grow"><label class="mu" for="ptarget">Long-term target (kg)</label><input id="ptarget" type="number" min="30" max="250" step="0.1" value="${P.target}"></div></div><button class="btn t" style="margin-top:10px" data-a="sp">Save profile & goals</button></details></div>`;

function spark(){const w=S.wt.slice(-12);if(w.length<2)return '';const ws=w.map(x=>x.w),lo=Math.min(...ws)-.5,hi=Math.max(...ws)+.5;return `<svg viewBox="0 0 200 50" style="width:100%;height:64px"><polyline pathLength="1" class="v" style="stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.4s ease" id="sp" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${w.map((x,i)=>(i*200/(w.length-1)).toFixed(1)+','+(46-(x.w-lo)/(hi-lo)*42).toFixed(1)).join(' ')}"/></svg>`}
function bdg(){const dk=key(),t=totals(dk),st=streak(),B=[['🔥','3-day streak',st>=3],['⚡','7-day streak',st>=7],['💧','Water goal',(S.wat[dk]||0)>=TG.w],['🥩','Protein goal',t.p>=TG.p],['🌾','Fiber goal',t.fi>=TG.fi],['🏋️','Workout',Object.keys(S.done[dk]||{}).some(k=>k[0]==='x'&&S.done[dk][k])],['🍽️','4 foods logged',(S.food[dk]||[]).length>=4]],n=B.filter(b=>b[2]).length;return `<div class="card"><div class="row"><h3 class="grow">Today’s badges</h3><span class="mu">${n} of ${B.length}</span></div><div class="chips" style="gap:12px;padding-top:10px">${B.map(b=>`<div style="flex:none;text-align:center;width:64px;${b[2]?'':'opacity:.3;filter:grayscale(1)'}"><div class="bd${b[2]?' on':''}">${b[0]}</div><div class="mu" style="font-size:.7rem;margin-top:4px">${b[1]}</div></div>`).join('')}</div></div>`}

function kNav(){const nv=$('nav');if(nv.children.length!==TABS.length)nv.innerHTML=TABS.map(x=>`<button data-a="tab" data-k="${x[0]}"><svg viewBox="0 0 24 24">${ICON[x[0]]}</svg>${x[1]}</button>`).join('');[...nv.children].forEach((b,j)=>{const on=TABS[j][0]===tab;b.classList.toggle('on',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});nv.style.setProperty('--i',TABS.findIndex(x=>x[0]===tab))}

function kTargets(o){const w=+o.wt||60,ht=+o.ht||170,age=+o.age||25,sx=o.sx==='f'?'f':'m',tw=+o.tw||w,g=o.g||'general',tr=+o.tr||0,act=Math.max(0,Math.min(3,+(o.act===undefined?1:o.act))),bmr=10*w+6.25*ht-5*age+(sx==='f'?-161:5),pal=Math.min(1.9,[1.2,1.3,1.4,1.55][act]+.04*Math.min(6,tr)),tdee=bmr*pal,bmi=w/Math.pow(ht/100,2),diff=tw-w;let dir=Math.abs(diff)<1?0:Math.sign(diff),weak=false;if(!dir){dir={fat:-1,muscle:1,strength:1}[g]||0;weak=dir!==0}let adj=0;if(dir>0){adj=Math.max(250,Math.min(500,tdee*.15));if(bmi<18.5)adj=Math.min(600,adj+100);if(weak)adj=Math.min(adj,tdee*.08)}else if(dir<0){adj=-Math.min(750,tdee*.2);if(weak)adj=-tdee*.12}
const floor=sx==='f'?1200:1500;let k=Math.round(Math.max(tdee+adj,bmr*1.05,floor)/50)*50;const ppk=g==='endurance'&&dir===0?1.4:dir<0?2:dir>0||g==='muscle'||g==='strength'?1.8:1.4,p=Math.round(Math.min(2.4,ppk)*w),f=Math.round(Math.max(.8*w,.27*k/9));let c=Math.round((k-4*p-9*f)/4);if(c<2*w){c=Math.round(2*w)}const fi=Math.max(25,Math.round(14*k/1000)),wl=Math.min(4000,Math.max(1500,Math.round((35*w+(tr?300:0))/250)*250));return{k,p,c,f,fi,w:wl,bmr,pal,tdee,adj:k-tdee,dir,weak,bmi,ppk:p/w,wt:w}}
function kProfObj(){const W=WK(),P2=S.prof2||{},sv=S.survey||{},w=(S.wt||[]).length?S.wt[S.wt.length-1].w:60,P=S.profile||{};return{wt:w,tw:P.target||w,ht:P.heightCm||170,age:P.age||25,sx:P2.sx||sv.sx||(W.p&&W.p.sx)||'m',g:sv.g||(W.p&&W.p.g)||'general',tr:P2.tr!==undefined?P2.tr:(Object.keys(W.plan||{}).length||sv.tr||0),act:P2.act!==undefined?P2.act:(sv.act===undefined?1:sv.act)}}
function kTgOnly(o){const t=kTargets(o);return{k:t.k,p:t.p,c:t.c,f:t.f,fi:t.fi,w:t.w}}
function kTgHTML(apply){const o=kProfObj(),t=kTargets(o),ch=(f,v,l)=>`<button class="${(f==='tr'?o.tr===v:f==='act'?o.act===v:o.sx===v)?'on':''}" data-kx="tgs" data-f="${f}" data-k="${v}">${l}</button>`;return'<h3 class="sh">Your targets</h3>'+(apply?`<div class="mu">Tell Koreva how you live so the numbers fit you.</div><div class="mu" style="margin-top:8px">Sex</div><div class="kxw">${ch('sx','m','Male')}${ch('sx','f','Female')}</div><div class="mu">Daily activity, apart from workouts</div><div class="kxw">${[[0,'Mostly sitting'],[1,'Some walking'],[2,'On my feet'],[3,'Physical work']].map(a=>ch('act',a[0],a[1])).join('')}</div><div class="mu">Workouts per week</div><div class="kxw">${[0,2,3,4,5,6].map(n=>ch('tr',n,n)).join('')}</div>`:'')+kWhyHTML(t,o)+(apply?'<button class="btn" style="margin-top:12px" data-kx="tga">Use these targets</button>':'')}
function kNut(){const t=kTargets(kProfObj());return{k:t.k,p:t.p,c:t.c,f:t.f,fi:t.fi,w:t.w}}
function kWhyHTML(t,o){const mo=Math.abs(t.adj)*30/7700,dirT=t.dir>0?'gain weight':t.dir<0?'lose weight':'stay at your weight';return`<div class="rcsec"><p><b>Your body</b><br>${o.wt} kg, ${o.ht} cm, ${o.age} years, ${o.sx==='f'?'female':'male'}. Target weight ${o.tw} kg.</p><p><b>Energy you burn</b><br>At rest (BMR, Mifflin-St Jeor): ${Math.round(t.bmr)} kcal. Activity factor ×${t.pal.toFixed(2)} (your day plus ${o.tr||0} workouts a week) = ${Math.round(t.tdee)} kcal to stay the same.</p><p><b>Your goal: ${dirT}</b><br>${t.dir?(t.adj>0?'+':'')+Math.round(t.adj)+' kcal a day, about '+mo.toFixed(1)+' kg a month'+(t.weak?' (gentle, because your target weight is close to your weight)':'')+'.':'No adjustment.'}</p><p><b>Daily targets</b><br>${t.k} kcal · protein ${t.p} g (${(t.p/o.wt).toFixed(1)} g per kg) · carbs ${t.c} g · fat ${t.f} g · fiber ${t.fi} g · water ${t.w} ml.</p></div><p class="mu">Weigh yourself 3 times a week and review after 2 to 3 weeks. If your weight does not move the way you want, change calories by about 150 kcal. This is guidance, not medical advice.</p>`}
/* ---------- themes sheet and settings placement ---------- */
function kThemeHTML(){const s=S.set||{},th=s.th||0;return`<h3 class="sh">Colours and themes</h3><div class="ksg">${KTM.map((t,i)=>`<button class="ksw${th===i?' on':''}" data-kx="thx" data-k="${i}" style="${t[2]?`background:linear-gradient(135deg,${t[2]},${t[4]});color:${t[5]};border-color:${th===i?t[7]:'transparent'}`:''}"><i style="background:${t[2]?t[7]:'var(--ac)'}"></i>${t[0]}</button>`).join('')}</div><div class="mu" style="margin-top:12px">Accent colour</div><div class="kxw" id="rcac">${KAC2.map(a=>`<button class="${s.ac===a[1]?'on':''}" data-kx="acx" data-k="${a[1]}">${a[0]}</button>`).join('')}<button class="${s.ac?'':'on'}" data-kx="acx" data-k="">Theme default</button></div>`}
function kSetBody(){const s=S.set||{},T=(k,l,d,on)=>`<div class="row" style="justify-content:space-between;align-items:center;margin:10px 0;gap:10px"><div><b>${l}</b><div class="mu">${d}</div></div><button class="btn${on?'':' t'}" style="min-width:68px;flex:none" data-kx="tg" data-k="${k}">${on?'On':'Off'}</button></div>`;return`<details class="card" style="margin-bottom:12px"><summary><b>Settings and connections</b></summary>${T('beep','Timer sounds','Beeps during the exercise timer',s.beep!==0)}${T('vib','Vibration','Haptic feedback and timer buzz',s.vib!==0)}${T('rm','Reduce motion','Turns off most animations',s.rm===1)}${T('nudge','Daily nudges','Gentle reminders at the times you chose',!!(S.nudge&&S.nudge.on))}${T('ab','Weekly auto-backup','Keeps one backup file in Documents/Koreva',s.ab!==0)}<button class="btn t" style="margin-top:8px" data-kx="obo">Redo my setup</button><button class="btn t" style="margin-top:8px" data-kx="ics">Export routine to calendar (.ics)</button><button class="btn t" style="margin-top:8px" data-kx="csv">Export data for Excel (.csv)</button><button class="btn t" style="margin-top:8px" data-kx="help">Watch, PC and Linux</button></details>`}
function kSettings(){return''}
const _vm3=viewMe;viewMe=function(){let h=_vm3();h=h.replace('<div class="card"><h3>Theme</h3>',kSetBody()+'<div class="card"><h3>Theme</h3>');h=h.replace('<button class="btn t" style="margin-top:10px" data-a="bk">','<button class="btn t" style="margin-top:10px" data-kx="thm">More colours and themes…</button><button class="btn t" style="margin-top:8px" data-a="bk">');h=h.replace('do not treat the defaults as a personalized diet plan.</p>','do not treat the defaults as a personalized diet plan.</p><div class="kxw"><button data-kx="tgr">Recalculate from my profile</button><button data-kx="tgw">Why these numbers?</button></div>');return h};
const _kob2=kOnbBody;kOnbBody=function(){let h=_kob2();if(KO.s===3&&KO.act===undefined)KO.act=1;if(KO.s===3)h=h.replace('<button class="btn t kxm ','<div class="mu" style="margin-top:10px">How active is your day, apart from workouts?</div><div class="kxw">'+[[0,'Mostly sitting'],[1,'Some walking'],[2,'On my feet'],[3,'Physical work']].map(a=>kC('act',a[0],a[1])).join('')+'</div><button class="btn t kxm ');return h};
/* ---------- food guide: render only 60 rows at a time (was 376 rows, 2700 DOM nodes) ---------- */
const _fl0=foodList;let FLIM=60,FLK='';foodList=function(q,cat){const kk=(q||'')+'|'+(cat||FCAT);if(kk!==FLK){FLK=kk;FLIM=60}const h=_fl0(q,cat),p=h.split('</button>');p.pop();if(p.length<=FLIM)return h;return p.slice(0,FLIM).join('</button>')+'</button><button class="btn t" style="margin:10px 0" data-kx="flm">Show more ('+(p.length-FLIM)+' left)</button>'};
/* ---------- events ---------- */
let KDB=0;const kRcDeb=(f)=>{clearTimeout(KDB);KDB=setTimeout(f,140)};
document.addEventListener('input',e=>{if(e.target.id==='rciq'){KRQ.iq=e.target.value;kRcDeb(kRcIng)}else if(e.target.id==='rcdq'){KRQ.dq=e.target.value;KRQ.lim=20;kRcDeb(kRcRes)}});
document.addEventListener('change',e=>{const i=e.target.id;if(i==='rcdt'){KRDF=e.target.value;KRQ.lim=20;kRcRes()}else if(i==='rcso'){KRQ.sort=e.target.value;KRQ.lim=20;kRcRes()}else if(i==='rcpo'){KRQ.port=+e.target.value;kRcRes()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-kx]');if(!b)return;const a=b.dataset.kx,k=b.dataset.k;
if(a==='rc'){S.pantry=S.pantry||[];KRQ.tab=0;KRQ.cat='all';KRQ.iq='';KRQ.dq='';KRQ.lim=20;KRQ.open=-1;showSheet(kRcHTML());kRcSync();kRcIng();kRcSel();kRcRes()}
else if(a==='rct'){KRQ.tab=+k;$('rcp0').style.display=k==='0'?'':'none';$('rcp1').style.display=k==='1'?'':'none';document.querySelectorAll('.rctab button').forEach(x=>x.classList.toggle('on',x===b));if(k==='1'){kRcSync();kRcRes()}}
else if(a==='rcc'){KRQ.cat=k;document.querySelectorAll('.rccat button').forEach(x=>x.classList.toggle('on',x===b));$('rcil').scrollTop=0;kRcIng()}
else if(a==='rci'){S.pantry=S.pantry||[];const i=S.pantry.indexOf(k);i>=0?S.pantry.splice(i,1):S.pantry.push(k);b.classList.toggle('on');save();kRcSel();KRQ.lim=20;KRQ.open=-1;if($('rcm'))kRcRes()}
else if(a==='rcrm'){S.pantry=(S.pantry||[]).filter(x=>x!==k);save();kRcSel();kRcIng();kRcRes()}
else if(a==='rcx'){S.pantry=[];save();kRcSel();kRcIng();kRcRes()}
else if(a==='rco'){KRQ.open=KRQ.open===+k?-1:+k;const el=$('rcr'),sc=el.scrollTop;kRcRes();el.scrollTop=sc}
else if(a==='rcm'){KRQ.lim+=20;const el=$('rcr'),sc=el.scrollTop;kRcRes();el.scrollTop=sc}
else if(a==='rcadd'){const d=KDS[+k];kLogged([{...kEnt(d,KRQ.port),m:kMeal()}],'Logged '+d.n);closeSheet()}
else if(a==='rcpin'){const d=KDS[+k];S.pins=S.pins||[];if(!S.pins.some(x=>x.n===d.n)){S.pins.push(kEnt(d,KRQ.port));save()}toast('Pinned '+d.n)}
else if(a==='flm'){FLIM+=60;const el=$('fl');if(el)el.innerHTML=foodList($('fq')?$('fq').value:'',FCAT)}
else if(a==='thm'){showSheet(kThemeHTML())}
else if(a==='thx'){S.set=S.set||{};S.set.th=+k;kTheme();save();document.querySelectorAll('#sb .ksw').forEach(x=>x.classList.toggle('on',x===b))}
else if(a==='acx'){S.set=S.set||{};S.set.ac=k;kTheme();save();document.querySelectorAll('#rcac button').forEach(x=>x.classList.toggle('on',x===b))}
else if(a==='tgr'||a==='tgw'){showSheet(kTgHTML(a==='tgr'))}
else if(a==='tgs'){S.prof2=S.prof2||{};S.prof2[b.dataset.f]=b.dataset.f==='sx'?k:+k;save();$('sb').innerHTML=kTgHTML(true)}
else if(a==='tga'){const t=kTargets(kProfObj());Object.assign(TG,{k:t.k,p:t.p,c:t.c,f:t.f,fi:t.fi,w:t.w});S.goals={...TG};NU.forEach(n=>{n[3]=TG[n[0]]});save();closeSheet();render(false);toast('Targets updated: '+t.k+' kcal, '+t.p+' g protein')}});
kTheme();render(false);
