<style>
:root{--bg:#f2f3f7;--card:rgba(255,255,255,.82);--cs:#fff;--tx:#14151a;--mu:#62646e;--ac:#d94a12;--c2:#0a84c6;--g:#14804a;--o:#b25f00;--red:#d1203a;--v:#6d4fd6;--line:rgba(0,0,0,.1);--soft:rgba(0,0,0,.07);--on:#fff;--glass:rgba(255,255,255,.72);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05060b;--card:rgba(30,32,44,.62);--cs:#262938;--tx:#f5f5f7;--mu:#a2a4b2;--ac:#ff7a3d;--c2:#5ad1ff;--g:#34e3a0;--o:#ffb020;--red:#ff5468;--v:#a78bfa;--line:rgba(255,255,255,.13);--soft:rgba(255,255,255,.1);--glass:rgba(14,16,24,.68);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05060b;--card:rgba(30,32,44,.62);--cs:#262938;--tx:#f5f5f7;--mu:#a2a4b2;--ac:#ff7a3d;--c2:#5ad1ff;--g:#34e3a0;--o:#ffb020;--red:#ff5468;--v:#a78bfa;--line:rgba(255,255,255,.13);--soft:rgba(255,255,255,.1);--glass:rgba(14,16,24,.68);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;padding:18px 16px 118px;max-width:560px;margin:0 auto;overflow-x:hidden}
.orb{position:fixed;width:min(80vmax,520px);height:min(80vmax,520px);border-radius:50%;filter:blur(80px);opacity:.3;z-index:-1;pointer-events:none;transform:translate3d(0,calc(var(--sy,0)*-.15px),0)}
.orb.a{top:-14%;left:-34%;background:var(--ac)}.orb.b{bottom:-18%;right:-34%;background:var(--c2)}
@media (prefers-reduced-motion:no-preference){.orb{animation:fl 16s ease-in-out infinite alternate}.orb.b{animation-direction:alternate-reverse}}
@keyframes fl{to{margin:40px 0 0 30px}}
h1{font-size:clamp(2.3rem,11vw,3.1rem);line-height:1.02;letter-spacing:-.04em;font-weight:760;margin:6px 4px 4px;transform-origin:left top;transform:scale(calc(1 - min(var(--sy,0),140)*.0007))}
h2{font-size:1.3rem;letter-spacing:-.02em;font-weight:680;margin:26px 4px 10px}
h3{font-size:1.06rem;font-weight:620;margin:0 0 4px;letter-spacing:-.01em}
h4{font-size:.95rem;margin:16px 0 8px}
.sub,.mu{color:var(--mu);font-size:.92rem}.sub{margin:0 4px 16px}
.card{background:var(--card);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border:1px solid var(--line);border-top-color:rgba(255,255,255,.28);border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:0 14px 34px -16px rgba(0,0,0,.45)}
.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .12s ease-out,background .2s,opacity .2s}
button:active{transform:scale(.96)}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:14px;padding:14px 16px;font-weight:650;width:100%;box-shadow:0 8px 22px -10px var(--ac)}
.btn.t{background:var(--soft);color:var(--ac);box-shadow:none}.btn.d{background:var(--soft);color:var(--red);box-shadow:none;margin-top:8px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:9px 2px;border-radius:9px;font-weight:620;font-size:.88rem;color:var(--mu)}
.seg .on{background:var(--cs);color:var(--tx);box-shadow:0 2px 6px rgba(0,0,0,.22)}
input{font:inherit;padding:12px;border-radius:13px;border:1px solid var(--line);background:var(--soft);color:var(--tx);width:100%;min-width:0}
.tmi{font-size:2.4rem;font-weight:700;text-align:center;letter-spacing:-.03em}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tk{display:flex;align-items:center;border-top:1px solid var(--line)}.tk:first-child{border-top:0}
.tg{flex:1;display:flex;gap:12px;align-items:flex-start;background:none;border:0;padding:12px 0;text-align:left;min-width:0}
.cb{width:27px;height:27px;border-radius:50%;border:2px solid var(--mu);flex:none;display:grid;place-items:center;color:transparent;font-weight:700;font-size:.85rem;transition:background .25s,border-color .25s}
.dn .cb{background:var(--g);border-color:var(--g);color:#fff}.dn .ti{color:var(--mu);text-decoration:line-through}
.pop .cb{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.tm{color:var(--ac);font-weight:620;font-size:.85rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ed{background:none;border:0;color:var(--ac);font-weight:620;padding:12px 2px 12px 10px}
.rg{display:flex;align-items:center;gap:16px}.rg svg{width:140px;height:140px;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.rg circle{fill:none;stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:60px 60px}
.tr{opacity:.18}.v{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.9,.25,1)}
.big{font-size:1.45rem;font-weight:720;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;width:0;border-radius:4px;transition:width .9s cubic-bezier(.2,.9,.25,1),background .3s}
.fr{width:100%;display:flex;gap:12px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;text-align:left}.fr:first-child{border-top:0}
details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:620}
ul{margin:6px 0 0;padding-left:18px}li{margin:6px 0}
.view{animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(var(--dx,0px)) translateY(10px);filter:blur(8px)}}
.tilt{position:relative;overflow:hidden;transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .6s cubic-bezier(.2,.9,.25,1)}
.tilt.hot{transition:none}
.tilt::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.25),transparent 55%);opacity:var(--go,0);transition:opacity .3s}
.sw{width:51px;height:31px;border-radius:16px;background:var(--soft);position:relative;border:0;flex:none;margin-left:8px}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.sw.on{background:var(--g)}.sw.on::after{transform:translateX(20px)}
.off{opacity:.45}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips button{flex:none;border:1px solid var(--line);background:var(--soft);border-radius:20px;padding:8px 14px;font-weight:600;font-size:.88rem}
.chips .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.fl{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:.92rem}.fl b{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.q{display:flex;gap:8px}.q button{width:48px;border:0;border-radius:13px;background:var(--soft);font-size:1.4rem;font-weight:600}.q input{text-align:center;font-size:1.2rem;font-weight:650}
.sh{font-size:1.35rem;margin-bottom:10px}
nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;background:var(--glass);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);border:1px solid var(--line);border-radius:28px;display:flex;padding:5px;z-index:10;box-shadow:0 12px 34px -8px rgba(0,0,0,.5)}
nav::before{content:"";position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/5);border-radius:23px;background:var(--soft);transform:translateX(calc(var(--i,0)*100%));transition:transform .55s cubic-bezier(.3,1.35,.5,1)}
nav button{flex:1;position:relative;border:0;background:none;color:var(--mu);font-size:.68rem;font-weight:620;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0}
nav button.on{color:var(--ac)}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sc{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20}
#sh{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--cs);border-radius:28px 28px 0 0;z-index:21;transform:translateY(110%);visibility:hidden;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -14px 50px rgba(0,0,0,.4)}
#hd{padding:10px 0 6px;touch-action:none;cursor:grab}#hd i{display:block;width:40px;height:5px;border-radius:3px;background:var(--mu);opacity:.55;margin:0 auto}
#sb{overflow:auto;padding:4px 18px calc(22px + env(safe-area-inset-bottom,0px))}

function foodCategory(f){const x=(f.n+' '+(f.aliases||'')+' '+(f.t||'')).toLowerCase();if(/mustard oil|sunflower oil|soybean oil|olive oil|coconut oil|cooking oil|ghee|table salt|namak|ketchup|chilli sauce|soy sauce|mayonnaise|table sugar|added sugar/.test(x))return 'Oils & sauces';if(/chicken|poultry|buffalo|\bbuff\b|goat|mutton|lamb|pork|duck|turkey|rabbit|venison|fish|machha|rohu|salmon|tuna|sardine|prawn|shrimp|crab|squid|calamari|\begg\b|anda|meat|masu/.test(x))return 'Meat & eggs';if(/coca-cola|coke|pepsi|sprite|fanta|mountain dew|sting|lemonade|nimbu pani|lemon water|iced tea|malt drink|bournvita|horlicks|maaza|frooti|red bull|soft drink|cola|lassi|mohi|buttermilk|milk tea|coffee|green tea|soy milk|whole milk|curd|dahi|yogurt|whey protein|paneer|cheese|butter|tofu/.test(x))return 'Drinks & dairy';if(/dal|daal|bhat|rice|roti|paratha|chiura|poha|khichdi|sattu|gundruk|saag|tarkari|dhido|dhindo|kheer|dhakani|sel roti|achar|pickle|chole|rajma|thukpa|chowmin|khasi|nepali|momo/.test(x))return 'Nepali foods';if(/banana|guava|apple|orange|papaya|spinach|palak|carrot|broccoli|potato|tomato|cucumber|onion|brinjal|okra|pumpkin|pea|corn|beetroot|radish|cabbage|cauliflower|pepper|lettuce|mango|watermelon|grape|pomegranate|pineapple|litchi|kiwi|strawberr|blueberr|avocado|fruit|vegetable/.test(x))return 'Fruit & veg';return 'Other'}
function foodList(q,cat=FCAT){q=(q||'').toLowerCase().trim();return FD().map((f,i)=>[f,i]).filter(([f])=>(cat==='All'||foodCategory(f)===cat)&&((f.n+' '+(f.t||'')+' '+(f.aliases||'')).toLowerCase().includes(q))).sort(([a],[b])=>q?Number((b.n+' '+(b.aliases||'')).toLowerCase().includes(q))-Number((a.n+' '+(a.aliases||'')).toLowerCase().includes(q)):0).map(([f,i])=>{const u=f.u[0],m=u[1]/(f.base||100);return `<button class="fr" data-a="fa" data-k="${i}"><span class="grow"><span class="ti">${esc(f.n)}</span><br><span class="mu">${esc((f.t||'Saved custom food').split('.')[0])}.<br>1 ${esc(u[0])}: ${R(f.k*m)} kcal, ${fmt(R(f.p*m*10)/10)} g protein</span></span><span class="tm">${R(f.k*m)} kcal</span></button>`}).join('')||'<p class="mu">No matches. Try another name, a local alias, or add a custom food from its label.</p>'}

function viewMe(){
 const l=S.wt.length?S.wt[S.wt.length-1]:{w:60},P=S.profile;
 let h=`<h1>Me</h1><p class="sub">Where you are and what to do about it</p><div class="card tilt"><div class="big" style="font-size:2.4rem"><span class="cu" data-n="${l.w}">${l.w}</span> kg</div><div class="mu">BMI ${(l.w/Math.pow(P.heightCm/100,2)).toFixed(1)}. Height ${P.heightCm} cm, age ${P.age}. BMI is a screening measure, not a diagnosis. Milestone: ${P.milestone} kg; longer-term target: ${P.target} kg.</div><div class="bar"><i data-w="${Math.max(0,Math.min(100,l.w/P.target*100))}%" style="background:var(--ac)"></i></div>${spark()}<div class="row" style="margin-top:6px"><input id="wkg" type="number" step="0.1" placeholder="Weight (kg)" aria-label="Weight in kilograms" min="25" max="300"><input id="warm" type="number" step="0.1" placeholder="Arm (cm)" aria-label="Optional arm circumference in centimetres" min="10" max="100"></div><button class="btn" style="margin-top:10px" data-a="addwt">Log today’s measurements</button>${S.wt.length?'<ul>'+S.wt.slice(-6).reverse().map(x=>`<li>${x.d}: ${x.w} kg${x.a?', arm '+x.a+' cm':''}</li>`).join('')+'</ul>':''}<details style="margin-top:12px"><summary>Profile & weight goals</summary><div class="row" style="margin-top:10px"><div class="grow"><label class="mu" for="pheight">Height (cm)</label><input id="pheight" type="number" min="100" max="230" step="0.5" value="${P.heightCm}"></div><div class="grow"><label class="mu" for="page">Age (years)</label><input id="page" type="number" min="13" max="110" value="${P.age}"></div></div><div class="row" style="margin-top:8px"><div class="grow"><label class="mu" for="pmile">First milestone (kg)</label><input id="pmile" type="number" min="30" max="250" step="0.1" value="${P.milestone}"></div><div class="grow"><label class="mu" for="ptarget">Long-term target (kg)</label><input id="ptarget" type="number" min="30" max="250" step="0.1" value="${P.target}"></div></div><button class="btn t" style="margin-top:10px" data-a="sp">Save profile & goals</button></details></div>`;

function kParse(s){const m=kFix(s).match(/^(\d+)×(max|\d+)( s)?/);return m?{n:+m[1],v:m[2]==='max'?0:+m[2],t:!!m[3],max:m[2]==='max'}:{n:3,v:10,t:false,max:false}}

const kH=()=>WK().hist||(WK().hist=[]),kLast=n=>[...kH()].reverse().find(h=>h.n===n);
function kHint(x){const l=kLast(x.n);if(!l)return'';const u=l.tm?' s':' reps';return'<br><span style="color:var(--g)">Last '+l.v+u+' · beat it: '+(l.v+(l.tm?5:1))+u+'</span>'}
const kPrep=()=>Math.max(5,Math.min(15,WK().prep||10)),kRest=()=>Math.max(15,Math.min(180,WK().rest||45)),kClock=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
let KR=null,KI=0,KWL=null;
function kBeep(f){try{const c=kBeep.c||(kBeep.c=new(window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();o.frequency.value=f||880;g.gain.value=.2;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.14)}catch(e){}}
function kGo(ph,s){KR.ph=ph;KR.end=Date.now()+s*1000;KR.dur=s;KR.ts=Date.now();KR.lb=-1;kDraw()}
function kRun(id){const x=((WK().plan[KD]||{}).ex||[]).find(y=>y.id===id);if(!x)return;KR={x,p:kParse(x.s),set:1,ph:'ready',res:[],t0:Date.now()};try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>{KWL=w}).catch(()=>{})}catch(e){}clearInterval(KI);KI=setInterval(kTick,200);kDraw()}
function kTick(){if(!KR)return clearInterval(KI);const n=$('kxn');if(KR.ph==='work'&&!KR.p.t){if(n)n.textContent=kClock(Math.floor((Date.now()-KR.ts)/1000));return}if(!['prep','work','rest'].includes(KR.ph))return;const left=Math.ceil((KR.end-Date.now())/1000);if(left!==KR.lb){KR.lb=left;if(left<=3&&left>0)kBeep(660);if(n)n.textContent=kClock(Math.max(0,left));const b=$('kxb');if(b)b.style.width=Math.min(100,(1-left/KR.dur)*100)+'%'}if(left<=0)kNext()}
function kNext(){const r=KR,p=r.p;if(r.ph==='prep'){kBeep(1000);vib(120);if(p.t)kGo('work',p.v);else{r.ph='work';r.ts=Date.now();kDraw()}}else if(r.ph==='work')kSet(p.v);else if(r.ph==='rest'){r.set++;kGo('prep',3)}}
function kSet(v){const r=KR;kBeep(1000);vib([100,60,100]);r.res.push({v,dur:Math.round((Date.now()-r.ts)/1000)});if(r.set>=r.p.n)kFinish();else kGo('rest',kRest())}
function kFinish(){const r=KR,H=kH(),best=Math.max(0,...r.res.map(s=>s.v)),prev=Math.max(0,...H.filter(h=>h.n===r.x.n).map(h=>h.v));r.last=kLast(r.x.n);r.best=best;r.pr=best>prev&&prev>0;r.dur=Math.round((Date.now()-r.t0)/1000);H.push({t:Date.now(),dk:key(),n:r.x.n,sets:r.res.length,v:best,tm:r.p.t,dur:r.dur,tot:r.res.reduce((a,s)=>a+s.v,0),pr:r.pr?1:0});const W=WK(),dk=key();W.log[dk]=W.log[dk]||{};W.log[dk][r.x.id]=true;save();r.ph='done';if(r.pr)kBeep(1300);kDraw()}
function kDraw(){let o=$('kxr');if(!o){o=document.createElement('div');o.id='kxr';document.body.appendChild(o)}const r=KR,p=r.p,x=r.x,u=p.t?' s':' reps';const T={ready:'Ready?',prep:'Get into position',work:p.t?'Hold':'Go',rest:'Rest',done:'Finished'}[r.ph];let b='';
if(r.ph==='ready')b=`<div class="mu">Get-ready time</div><div class="row" style="justify-content:center;gap:12px;margin:8px 0 14px"><button class="btn t" data-kx="rp" data-k="-1">−</button><b style="font-size:1.6rem;min-width:70px">${kPrep()} s</b><button class="btn t" data-kx="rp" data-k="1">+</button></div><button class="btn" data-kx="rstart">Start</button>`;
else if(r.ph==='done'){const d=r.last?r.best-r.last.v:null;b=`<p class="big">${r.pr?'New personal best!':'Nice work'}</p><div class="mu">${r.res.length} sets · best ${r.best}${u} · ${kClock(r.dur)} total</div><div style="margin-top:8px">${d===null?'First result saved. Beat it next time.':d>0?'+'+d+u+' vs last time':d<0?d+u+' vs last time':'Matched last time'}</div>`}
else b=`<div id="kxn" class="kxn">${kClock(r.ph==='work'&&!p.t?0:r.dur)}</div><div class="bar"><i id="kxb" style="width:0;background:var(--ac)"></i></div>`+(r.ph==='work'&&!p.t?`<p class="mu">Do ${p.max?'as many reps as you can':p.v+' reps'}, then tap Done.</p><button class="btn" data-kx="rdone">Done set</button>`:'')+(r.ph==='rest'?`<p class="mu">Next: set ${r.set+1}, ${p.t?p.v+' s':p.max?'max reps':p.v+' reps'}</p><div class="row" style="gap:8px;justify-content:center;margin:10px 0"><button class="btn t" data-kx="rr" data-k="-15">−15 s</button><button class="btn t" data-kx="rr" data-k="15">+15 s</button></div>`:'')+(r.ph==='prep'||r.ph==='rest'?'<button class="btn t" data-kx="rskip">Skip</button>':'');
o.innerHTML=`<div class="kxc"><div class="mu">${esc(T)}${r.ph==='done'?'':' · set '+Math.min(r.set,p.n)+' of '+p.n}</div><h2>${esc(x.n)}</h2><p class="mu" style="margin:0 0 10px">${esc(kFmt(x.s))}</p>${b}<button class="btn t" style="margin-top:10px" data-kx="rstop">${r.ph==='done'?'Close':'Stop'}</button></div>`;kTick()}
function kProg(){const W=WK(),H=kH(),n=new Date(),w0=new Date(n);w0.setDate(n.getDate()-((n.getDay()+6)%7));w0.setHours(0,0,0,0);const wh=H.filter(h=>h.t>=w0.getTime()),dys=new Set(wh.map(h=>h.dk)).size,sets=wh.reduce((a,h)=>a+h.sets,0),prs=wh.filter(h=>h.pr).length,pd=Math.max(2,Object.keys(W.plan).length||3),ch=[['Train '+pd+' days',dys,pd],['Complete '+pd*8+' sets',sets,pd*8],['Set 2 personal bests',prs,2]];const mx=[0,0,0,0,0,0,0];wh.forEach(h=>{mx[(new Date(h.t).getDay()+6)%7]+=h.dur/60});const top=Math.max(1,...mx),bests={};H.forEach(h=>{if(!bests[h.n]||h.v>bests[h.n].v)bests[h.n]=h});const bl=Object.values(bests).sort((a,b)=>b.t-a.t).slice(0,4);
return`<h2>Challenges</h2><div class="card"><div class="mu">This week</div>${ch.map(c=>`<div style="margin-top:10px"><div class="row" style="justify-content:space-between"><b>${c[0]}</b><span class="mu">${Math.min(c[1],c[2])}/${c[2]}${c[1]>=c[2]?' ✓':''}</span></div><div class="bar"><i data-w="${Math.min(100,c[1]/c[2]*100)}%" style="background:var(--ac)"></i></div></div>`).join('')}<div class="kxg">${mx.map(v=>`<i style="height:${Math.max(6,v/top*100)}%"></i>`).join('')}</div><div class="mu" style="display:flex;justify-content:space-between"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div></div><div class="card"><h3>Personal bests</h3>${bl.length?bl.map(b=>`<div class="row" style="justify-content:space-between;margin-top:6px"><span>${esc(b.n)}</span><b>${b.v}${b.tm?' s':' reps'}</b></div>`).join('')+'<button class="btn t" style="margin-top:10px" data-kx="share">Challenge a friend</button>':'<div class="mu">Finish an exercise with the ▶ timer to start your record book. Each time you beat your last result, it shows here.</div>'}</div>`}
function kWA(n){const b=document.createElement('button');b.dataset.a='wa';b.dataset.k=String(n);document.body.appendChild(b);b.click();b.remove()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-kx]');if(!b)return;const a=b.dataset.kx,k=+b.dataset.k,W=WK();
if(a==='run')kRun(b.dataset.k);else if(a==='rstart')kGo('prep',kPrep());else if(a==='rp'){W.prep=Math.max(5,Math.min(15,kPrep()+k));save();kDraw()}else if(a==='rr'){KR.end+=k*1000;KR.dur+=k;W.rest=Math.max(15,Math.min(180,kRest()+k));save()}else if(a==='rskip'){KR.end=Date.now()}else if(a==='rdone'){let v=KR.p.v;if(KR.p.max){v=parseInt(prompt('How many reps did you do?',''),10)||0}kSet(v)}
else if(a==='rstop'){clearInterval(KI);try{KWL&&KWL.release()}catch(x){}const o=$('kxr');if(o)o.remove();KR=null;render(false)}
else if(a==='wc'){showSheet(`<h3 class="sh">Water</h3><div class="mu">Amount (ml)</div><input id="kwa" type="number" inputmode="numeric" placeholder="e.g. 170"><div class="row" style="gap:8px"><button class="btn" data-kx="wadd">Add</button><button class="btn t" data-kx="wsub">Remove</button></div><div class="mu" style="margin-top:14px">My cup or glass size (ml)</div><input id="kwc" type="number" inputmode="numeric" value="${S.cup||250}"><button class="btn t" data-kx="wset">Save cup size</button>`)}
else if(a==='wadd'||a==='wsub'){const n=parseInt($('kwa').value,10);if(n>0&&n<=3000){closeSheet();kWA(a==='wadd'?n:-n)}else toast('Enter an amount in ml')}
else if(a==='wset'){const n=parseInt($('kwc').value,10);if(n>=50&&n<=2000){S.cup=n;save();closeSheet();render(false);toast('Cup size set to '+n+' ml')}else toast('Use 50 to 2000 ml')}
else if(a==='share'){const H=kH(),t=H.length?'My Koreva best: '+[...H].sort((x,y)=>y.t-x.t)[0].n+' '+[...H].sort((x,y)=>y.t-x.t)[0].v+([...H].sort((x,y)=>y.t-x.t)[0].tm?' s':' reps')+'. Beat it!':'Join me on Koreva!';try{navigator.share?navigator.share({text:t}):navigator.clipboard.writeText(t).then(()=>toast('Copied. Paste it to a friend'))}catch(x){}}});
function kNat(){try{return window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins.KorevaAlarm}catch(e){return 0}}
window.kxSync=async()=>{const A=kNat();if(!A)return;try{const L=Capacitor.Plugins.LocalNotifications;if(L&&!S.kxc){const q=await L.getPending();if(q.notifications.length)await L.cancel({notifications:q.notifications});S.kxc=1}const r=await A.schedule({alarms:S.al.filter(a=>a.on).map(a=>({id:String(a.id),h:a.h,m:a.m,d:a.d,l:a.l||'Alarm',sn:a.sn||10}))});if(r&&r.exact===false&&!window.kxW){window.kxW=1;toast('Allow Alarms & reminders for Koreva');A.settings()}}catch(e){}};
setTimeout(()=>window.kxSync&&window.kxSync(),900);
</script>
